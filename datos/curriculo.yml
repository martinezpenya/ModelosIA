# FUENTE ÚNICA de horas, semanas, RA/CE, pesos y calendario del módulo 5071.
# Copia AUTORITATIVA: este fichero, en ModelosIA (sitio maestro desde 2026-08-20).
# Ninguna tabla de estos datos se escribe a mano: se edita aquí y se ejecuta
#   python3 scripts/generar_tablas.py
# que rellena los bloques <!-- AUTO:x inicio/fin --> de docs/index.md.
# Fuente única de verdad curricular del módulo 5071.
#
# Toda tabla de unidades, horas, pesos o RA/CE que aparezca en el repositorio debe
# generarse desde aquí con `scripts/generar_tablas.py`, nunca escribirse a mano.
# Los bloques destino van marcados con <!-- AUTO:<tabla> inicio --> ... <!-- AUTO:<tabla> fin -->.

modulo:
  codigo: "5071"
  denominacion: Modelos de Inteligencia Artificial
  curso_especializacion: Inteligencia Artificial y Big Data (Grado E)
  centro: IES Eduardo Primo Marqués (Carlet)
  curso_academico: "2026-2027"
  horas: 90
  ects: 4
  horas_semanales: 3
  semanas: 30
  fin_contenidos: finales de abril (semana 24)

# RA/CE prescriptivos: RD 279/2021 (art. 3.2 del Decreto 95/2026 CV).
# RA7 no figura en el RD: es un proyecto integrador acordado por el equipo docente del curso.
resultados_aprendizaje:
  - id: RA1
    ce: 4
    enunciado: >-
      Caracteriza sistemas de Inteligencia Artificial relacionándolos con la mejora de la
      eficiencia operativa de las organizaciones y empresas.
  - id: RA2
    ce: 6
    enunciado: >-
      Utiliza modelos de sistemas de Inteligencia Artificial implementando sistemas de
      resolución de problemas.
  - id: RA3
    ce: 7
    enunciado: >-
      Relaciona el procesamiento de lenguaje natural con sus aplicaciones determinando su
      potencial e identificando sus limitaciones.
  - id: RA4
    ce: 4
    enunciado: Analiza sistemas robotizados, evaluando opciones de diseño e implementación.
  - id: RA5
    ce: 5
    enunciado: >-
      Aplica sistemas expertos evaluando la influencia de los controladores inteligentes en el
      comportamiento del sistema.
  - id: RA6
    ce: 6
    enunciado: >-
      Aplica principios legales y éticos al desarrollo de la Inteligencia Artificial
      integrándolos como parte del proceso.
  - id: RA7
    ce: 9
    enunciado: >-
      Desarrolla un proyecto integrador que combine técnicas de IA y análisis de datos masivos
      para resolver un problema real o simulado, gestionando todo el ciclo de vida del proyecto.
    nota: Transversal al curso de especialización; lo imparte y califica todo el equipo docente.

