    aqui: RA1-RA6 al 13,33 % + RA7 al 20 % (suma 100 %)
    programacion_docx: RA3-RA6 al 20 % cada uno (suma 120 %)
    alternativa_index_modelosia: RA1=10, RA2=10, RA3..RA6=15, RA7=20 (suma 100 %)
    estado: RESUELTO 2026-08-20 — se mantiene el reparto de aquí; el RA7 sí cuenta en el módulo
  - asunto: horas por unidad
    aqui: UD01 = 12 h (RA1 solo) · RA1 + RA2 = 24 h
    programacion_docx: UD01 = 27 h (RA1 + RA2 juntos)
    estado: >
      Resuelto en lo esencial 2026-08-20 (una UD por RA + temporalización real). Fleco: 3 h de
      diferencia entre las 24 h de aquí y las 27 h del .docx; cuadrarlas al unificar en F6.
  - asunto: ubicación de Docker
    aqui: dentro de UD00 (6 h con la presentación)
    modelosia: sección propia en la navegación; en Moodle es «Taller UD00_T01»
    estado: >
      Ubicación PENDIENTE (unidad propia o dentro de UD00). Evaluación RESUELTA 2026-08-20: UD00 y
      el taller de Docker son REQUISITO NO CALIFICABLE, sin ítem en el cuaderno de Moodle; todo el
      peso sigue en RA1-RA7. Aviso: como unidad propia sería una segunda unidad sin RA.
