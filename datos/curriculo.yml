# Calendario real del curso 2026-2027 (fuente única; no escribir fechas a mano en otros ficheros).
# Verificado en fuentes/Instrucciones_26-27_FP_DOGV.pdf (Resolución SAE 15/07/2026, DOGV 2026/24495):
# «La docencia de los cursos de especialización se iniciará el 1 de octubre de 2026 y finalizará como
# máximo el 18 de junio de 2027». Vacaciones y festivos: calendario escolar de Carlet 26-27
# facilitado por el profesor. Horario del CE: LUNES A JUEVES (los viernes no hay clase; el alumnado
# los aprovecha para tareas y talleres en casa).
calendario:
  inicio_docencia: 2026-10-01        # jueves
  fin_curso_centro: 2027-05-28       # el CE acaba en mayo; junio es para la prueba ordinaria
  fin_maximo_legal: 2027-06-18
  dias_clase: [lunes, martes, miércoles, jueves]
  horas_semanales_curso: 20          # 600 h / 30 semanas nominales · el módulo 5071 son 3 h/semana
  vacaciones:
    navidad: [2026-12-22, 2027-01-06]
    pascua: [2027-03-25, 2027-04-05]
  festivos:
    - {fecha: 2026-10-09, dia: viernes, afecta: false}   # Comunitat Valenciana
    - {fecha: 2026-10-12, dia: lunes, afecta: true}      # Fiesta Nacional
    - {fecha: 2026-12-07, dia: lunes, afecta: true}      # puente
    - {fecha: 2026-12-08, dia: martes, afecta: true}     # Inmaculada
    - {fecha: 2027-03-17, dia: miércoles, afecta: true}  # Fallas
    - {fecha: 2027-03-18, dia: jueves, afecta: true}     # Fallas
    - {fecha: 2027-03-19, dia: viernes, afecta: false}   # Fallas
  # Horario del módulo 5071 — POR CONFIRMAR (probable 2 h un día + 1 h otro día).
  # Sesiones disponibles por día del 01/10/26 al 28/05/27, ya descontadas vacaciones y festivos:
  #   lunes 28 (pierde 12/10 y 07/12) · martes 29 (pierde 08/12)
  #   miércoles 29 (pierde 17/03)     · jueves 30 (pierde 18/03)
  # El jueves es el mejor día: el curso arranca en jueves (01/10) y también es lectivo el 07/01.
  # Horas resultantes del módulo según el reparto (nominal 90 h):
  #   2 h jueves + 1 h miércoles o martes = 89 h  ← el mejor reparto 2+1
  #   2 h lunes  + 1 h martes o miércoles = 85 h  ← el peor, 5 h por debajo
  #   3 h en un solo día: jueves 90 h · martes/miércoles 87 h · lunes 84 h
  horario_modulo:
    confirmado: false
    hipotesis: 2h+1h            # dos sesiones semanales en días distintos
    recomendacion_bloque_2h: jueves
    evitar_bloque_2h: lunes
    consecuencia_didactica: >
      Con 2 h + 1 h hay DOS sesiones por semana, no una de 3 h: el bloque de 2 h es el único que
      admite notebooks, talleres y Robocode (montaje + ejecución), y la sesión de 1 h sirve para
      teoría breve, ejercicios, repaso y la prueba por RA en Moodle. Las tablas «Sesiones» de las
      siete unidades están escritas para UN bloque semanal de 3 h y habría que dividirlas en 2 h + 1 h.
  semanas_con_clase: 33              # 01/10/26–28/05/27 · 25 completas (4 d) + 8 reducidas
  semanas_reducidas: [2026-09-28, 2026-10-12, 2026-12-07, 2026-12-21, 2027-01-04,
                      2027-03-15, 2027-03-22, 2027-04-05]
  nota: >
    El módulo necesita 30 semanas de 3 h y hay 33 con clase: 3 de margen. Ese margen se coloca en
    los tramos ya fragmentados (diciembre-enero para RA5, y Fallas/Pascua para RA6), no en semanas
    de repaso: el profesor hace una prueba por RA en Moodle al cierre de cada unidad, así que no se
    reservan semanas de parcial. Los festivos del 9 de octubre y del 19 de marzo caen en viernes y
    no cuestan sesión. AVISO: el día de la semana asignado al módulo aún no se conoce, así que
    según cuál sea se perderán 1 o 2 sesiones por festivo (lunes: 12/10, 07/12 y 05/04; martes:
    08/12; miércoles: 17/03; jueves: 18/03). Dejar una sesión de holgura por unidad.

evaluacion:
  peso_actividades: 40
  peso_prueba_escrita: 60
  nota_minima_por_ra: 5
  pesos_ra:
    RA1: 13.33
    RA2: 13.33
    RA3: 13.33
    RA4: 13.33
    RA5: 13.33
    RA6: 13.33
    RA7: 20
  nota: >-
    RA1-RA6 = 80 % (13,33 % cada uno) + RA7 = 20 %. El criterio «cada RA ≥5» es del centro,
    más estricto que el mínimo de la Orden 8/2025 (art. 5.2); debe constar en la programación
    citando los arts. 5.1 y 12.9.

