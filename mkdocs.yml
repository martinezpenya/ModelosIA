    - Actividades Entregables: UD05/UD05_ActividadesEntregables.md
    - Notebooks:
      - 0 Sistema experto con Python y Experta: UD05/notebooks/UD05_N01_experta_primeros_pasos.ipynb
      - 0 Piedra, papel o tijera: UD05/notebooks/UD05_N02_piedra_papel_tijera.ipynb
      - 1 Clasificación de animales: UD05/notebooks/UD05_N03_clasificacion_animales.ipynb
      - 2 Reglas sobre datos, Titanic: UD05/notebooks/UD05_N04_reglas_desde_datos_titanic.ipynb
      - 3 Control difuso, regar el césped: UD05/notebooks/UD05_N05_control_difuso_riego.ipynb
      - 4 Lógica difusa, quién jugará: UD05/notebooks/UD05_N06_logica_difusa_quien_jugara.ipynb
      - EX0 Sistema experto de libre elección: UD05/notebooks/UD05_EX0_sistema_experto_libre.ipynb
      - EX0 Referencia, tasación de vehículos: UD05/notebooks/UD05_EX0_referencia_tasacion_vehiculos.ipynb
      - EX1 Detectar lesiones de rodilla: UD05/notebooks/UD05_EX1_lesiones_rodilla.ipynb
      - EX2 Previsión del valor de mercado: UD05/notebooks/UD05_EX2_valor_mercado_jugadores.ipynb
      - EX3 Centrocampistas con potencial: UD05/notebooks/UD05_EX3_centrocampistas_jovenes.ipynb
