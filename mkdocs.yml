plugins:
    - mkdocs-video
    # Render local de notebooks (decisión 2026-08-20: render local + enlace a Colab).
    # Acotado a las unidades ya fusionadas; se amplía el patrón al fusionar cada una.
    - mkdocs-jupyter:
        include: ["UD00/notebooks/*.ipynb", "UD04/notebooks/*.ipynb", "UD05/notebooks/*.ipynb", "UD06/notebooks/*.ipynb"]
        include_source: true
        execute: false
        ignore_h1_titles: true
    - redirects:
        redirect_maps:
            # Docker pasa a formar parte de la UD00 (decisión 2026-08-20).
            # La URL antigua queda redirigida para no romper enlaces ya indexados.
            'Docker/Docker.md': 'UD00/UD00_ES.md'
            # Renumeración a «UDxx = RA» (2026-08-22): la UD02 antigua (RA5) pasa a UD05.
            # OJO: la UD05 antigua (RA6, ética) pasa a UD06, pero NO se puede redirigir:
            # 'UD05/*' lo ocupa ahora RA5 y el plugin sobrescribiría la página real sin avisar.
            'UD02/UD02_ES.md': 'UD05/UD05_ES.md'
            'UD02/UD02_Diapositivas.md': 'UD05/UD05_Diapositivas.md'
            'UD02/UD02_ActividadesGuiadas.md': 'UD05/UD05_ActividadesGuiadas.md'
            'UD02/UD02_ActividadesEntregables.md': 'UD05/UD05_ActividadesEntregables.md'
            # Un taller, una página (2026-08-23): la página que los reunía desaparece.
            'UD05/UD05_Talleres.md': 'UD05/UD05_T01_Simular_sistema_experto_ES.md'
            # Los notebooks de la UD05 se renombraron al castellano el 2026-08-23 y sus URLs
            # antiguas (publicadas ese mismo día) quedan rotas. NO se pueden redirigir: el plugin
            # solo acepta fuentes `.md` y avisa «is not a valid markdown file» con un `.ipynb`.
            # Se asume la rotura: el curso no ha empezado y estuvieron publicadas menos de un día.
    # - offline  # Comentado para permitir indexación SEO
    - search
    - git-revision-date-localized:
        fallback_to_build_date: true
    - minify:
        minify_html: true
    - extra-sass
    - with-pdf:
        author: David Martinez Peña
        #copyright: (www.martinezpenya.es)
        #
        cover: true
        #cover_logo: docs/assets/images/aws_cast.png
        cover_logo: https://martinezpenya.es/ModelosIA/assets/portada.png
        back_cover: true
        #cover_title: TITLE TEXT
        cover_subtitle: IES Eduardo Primo Marques (Carlet)
        #custom_template_path: templates
        #
        toc_title: Indice de contenidos
        #heading_shift: false
        toc_level: 3
        ordered_chapter_level: 2
        #excludes_children:
        #    - 'release-notes/:upgrading'
        #    - 'release-notes/:changelog'
        #
        exclude_pages:
            - 'UD00/assets/'
            - 'UD00/Presentacion/'
            - 'UD00/entorno/'
            - 'UD01/assets/IABDBotMaven.zip'
            - 'UD01/Presentacion/'
            - 'UD05/Presentacion/'
            - 'UD06/Presentacion/'
            - 'UD06/assets/'
            - 'UD05/Dockerfile'
            - 'UD05/docker-compose.yml'
            - 'UD03/Presentacion/'
            - 'UD04/Presentacion/'
        convert_iframe:
            - src: 'https://martinezpenya.es/ModelosIA/UD00/Presentacion/UD00_1_ES.html'
              img: 'docs/UD00/Presentacion/img/poster-slide1.png'
              text: 'Ver la presentación interactiva de la UD00'
            - src: 'https://martinezpenya.es/ModelosIA/UD06/Presentacion/UD06_1_ES.html'
              img: 'docs/UD06/Presentacion/img/poster-slide1.png'
              text: 'Ver la presentación interactiva de la UD06'
            - src: 'https://martinezpenya.es/ModelosIA/UD05/Presentacion/UD05_1_ES.html'
              img: 'docs/UD05/Presentacion/img/poster-slide1.png'
              text: 'Ver la presentación interactiva de la UD05'
            - src: 'https://martinezpenya.es/ModelosIA/UD04/Presentacion/UD04_1_ES.html'
              img: 'docs/UD04/Presentacion/img/poster-slide1.png'
              text: 'Ver la presentación interactiva de la UD04'
        #two_columns_level: 3
        #
        #render_js: true
        #headless_chrome_path: headless-chromium
        #
        output_path: docs/Libro.pdf
        #enabled_if_env: ENABLE_PDF_EXPORT
        #
        #debug_html: true
        # show_anchors: true
        # verbose: true
