site_name: 'Modelos de IA (CE Inteligencia Artificial y Big Data)'
site_url: https://martinezpenya.es/ModelosIA/
repo_url: https://github.com/martinezpenya/ModelosIA
edit_uri: edit/main/docs
use_directory_urls: false

exclude_docs: |
  UD01/Presentacion/*.md
  UD02/Presentacion/*.md
  UD03/Presentacion/*.md

nav:
  - Información importante: index.md
  - UD00:
    - Presentación del módulo y curso rápido de Docker: UD00/UD00_ES.md
    - Ejercicios: UD00/UD00_Ejercicios.md
    - Talleres:
      - T01 Verificación del entorno y primer contenedor: UD00/UD00_T01_Verificacion_entorno_ES.md
      - T02 Contenedor de prácticas de IA: UD00/UD00_T02_Contenedor_practicas_ES.md
    - Notebooks:
      - Entorno Python para IA: UD00/notebooks/UD00_entorno_python_ia.ipynb
  - UD01:
    - Caracterización de sistemas y utilización de modelos de Inteligencia Artificial: UD01/UD01_ES.md
    - Diapositivas: UD01/diapositivas.md
    - Actividades:
      - P00 Comparativa Java vs Python: UD01/UD01_P00_Comparativa_Java_VS_Python_ES.md
      - P01 Robocode (Java): UD01/UD01_P01_RobocodeTankRoyale_ES.md
      - P01 Robocode (Python): UD01/UD01_P01_RobocodeTankRoyale_Python_ES.md
      - P02 Entregable: UD01/UD01_P02_Practica_ES.md
    - Talleres:
      - T01 Java/Python: UD01/UD01_T01_IDE_ES.md
      - T02 GitHub: UD01/UD01_T02_GitHub.md
      - T03 Markdown: UD01/UD01_T03_Markdown.md
  - UD02:
    - Sistemas basados en el conocimiento: UD02/UD02_ES.md
    - Diapositivas: UD02/UD02_Diapositivas.md
    - Actividades Guiadas: UD02/UD02_ActividadesGuiadas.md
    - Actividades Entregables: UD02/UD02_ActividadesEntregables.md
  - UD03:
    - Procesamiento del Lenguaje Natural: UD03/UD03_ES.md
    - Diapositivas: UD03/UD03_Diapositivas.md
    - Actividades Guiadas: UD03/UD03_ActividadesGuiadas.md
    - Actividades Entregables: UD03/UD03_ActividadesEntregables.md
  - UD04:
    - Análisis de sistemas robotizados: UD04/UD04_ES.md
    - Diapositivas: UD04/UD04_Diapositivas.md
    - Actividades Guiadas: UD04/UD04_ActividadesGuiadas.md
    - Actividades Entregables: UD04/UD04_ActividadesEntregables.md
  - UD05:
    - Aplicación de principios legales y éticos de la IA: UD05/UD05_ES.md
    - Diapositivas: UD05/UD05_Diapositivas.md
    - Actividades Guiadas: UD05/UD05_ActividadesGuiadas.md
    - Actividades Entregables: UD05/UD05_ActividadesEntregables.md
  - Sobre mi: sobremi.md
  - Fuentes de información: fuentes.md

theme:
  name: material
  language: es
  features:
    - header.autohide
    - content.action.edit
    - content.code.copy
    - content.code.select
    - content.code.anotate
    #- content.tabs.link
    - toc.follow
    - toc.integrate
    - navigation.top
    #- navigation.tracking
    - navigation.footer
    #- navigation.indexes
  icon:
    logo: material/robot-confused-outline
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/hexagon-nodes
      quote: fontawesome/solid/quote-left
  favicon: assets/favicon.ico
#  features:
#    - navigation.footer
  palette:
    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: teal
      accent: lime
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: teal
      accent: lime
  font:
    text: Roboto
    code: Roboto Mono
extra_css:
  - css/extra.css
markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
#      emoji_index: !!python/name:material.extensions.emoji.twemoji
#      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      linenums: true
      #anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
#          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.arithmatex
extra_javascript:
  - js/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg-full.js
extra:
  search:
    language: es
  meta:
    - name: description
      content: "Apuntes de Modelos de Inteligencia Artificial para el curso de especialización de IA y Big Data"
    - name: author
      content: "David Martínez Peña"
    - name: keywords
      content: "inteligencia artificial, big data, machine learning, NLP, procesamiento lenguaje natural, robótica, ética IA, sistemas expertos"
  social:
    - icon: simple/youtube
      link: https://youtube.com/@martinezpenya
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/martinezpenya
    - icon: fontawesome/brands/github
      link: https://github.com/martinezpenya
    - icon: fontawesome/solid/mug-saucer
      link: https://buymeacoffee.com/martinezpenya
      name: Buy me a coffee
#  consent:
#    title: Consentimiento de cookie
#    description: >-
#      Esta página de apuntes utiliza cookies para reconocer las visitas, medir la #efectividad de la documentación
#      y averiguar si encuentras aquello que buscas o cómo has llegado a estos apuntes.
#      Con tu consentimiento, me ayudas a mejorar estos materiales.

copyright: "© 2025 David Martínez licensed under CC BY-NC-SA 4.0"

plugins:
    - mkdocs-video
    # Render local de notebooks (decisión 2026-08-20: render local + enlace a Colab).
    # Acotado a las unidades ya fusionadas; se amplía el patrón al fusionar cada una.
    - mkdocs-jupyter:
        include: ["UD00/notebooks/*.ipynb"]
        include_source: true
        execute: false
    - redirects:
        redirect_maps:
            # Docker pasa a formar parte de la UD00 (decisión 2026-08-20).
            # La URL antigua queda redirigida para no romper enlaces ya indexados.
            'Docker/Docker.md': 'UD00/UD00_ES.md'
    # - offline  # Comentado para permitir indexación SEO
    - search
    - git-revision-date-localized:
        fallback_to_build_date: true
    - minify:
        minify_html: true
    - extra-sass
    - with-pdf:
        author: David Martinez Peña
        #copyright: (www.martinezpenya.es)
        #
        cover: true
        #cover_logo: docs/assets/images/aws_cast.png
        cover_logo: https://martinezpenya.es/ModelosIA/assets/portada.png
        back_cover: true
        #cover_title: TITLE TEXT
        cover_subtitle: IES Eduardo Primo Marques (Carlet)
        #custom_template_path: templates
        #
        toc_title: Indice de contenidos
        #heading_shift: false
        toc_level: 3
        ordered_chapter_level: 2
        #excludes_children:
        #    - 'release-notes/:upgrading'
        #    - 'release-notes/:changelog'
        #
        exclude_pages:
            - 'UD00/assets/'
            - 'UD00/entorno/'
            - 'UD00/notebooks/'
            - 'UD01/assets/IABDBotMaven.zip'
            - 'UD01/Presentacion/'
            - 'UD02/Presentacion/'
            - 'UD02/Dockerfile'
            - 'UD02/docker-compose.yml'
            - 'UD03/Presentacion/'
            - 'UD04/Presentacion/'
        #convert_iframe:
        #    - src: IFRAME SRC
        #      img: POSTER IMAGE URL
        #      text: ALTERNATE TEXT
        #    - src: ...
        #two_columns_level: 3
        #
        #render_js: true
        #headless_chrome_path: headless-chromium
        #
        output_path: docs/Libro.pdf
        #enabled_if_env: ENABLE_PDF_EXPORT
        #
        #debug_html: true
        # show_anchors: true
        # verbose: true
