      - 2 Vehículos de Braitenberg: UD04/notebooks/UD04_N02_vehiculos_braitenberg.ipynb
      - 3 Ejemplos de robots en AITK: UD04/notebooks/UD04_N03_ejemplos_robots.ipynb
