      - EX5 Controlar el robot con una red neuronal: UD04/notebooks/UD04_EX5_red_neuronal.ipynb
      - EX6 Aprendizaje por refuerzo con NEAT: UD04/notebooks/UD04_EX6_neat.ipynb
      - T01 Cinemática de un manipulador: UD04/notebooks/UD04_T01_cinematica_manipulador.ipynb
      - T02 Diseño de un sistema robotizado: UD04/notebooks/UD04_T02_diseno_sistema_robotizado.ipynb
